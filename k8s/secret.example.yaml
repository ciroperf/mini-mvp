# Copia questo file in secret.yaml (escluso da git) e sostituisci i
# placeholder con valori reali prima di applicarlo. DATABASE_URL contiene
# utente e password di Postgres, quindi va trattato come segreto.
apiVersion: v1
kind: Secret
metadata:
  name: mini-mvp-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://<user>:<password>@<host>:5432/<db>"
  POSTGRES_USER: "<user>"
  POSTGRES_PASSWORD: "<password>"
  POSTGRES_DB: "<db>"
